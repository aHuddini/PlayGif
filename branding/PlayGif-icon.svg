<svg xmlns="http://www.w3.org/2000/svg" width="256" height="256" viewBox="0 0 256 256">
  <!-- PlayGif icon - "slash reveal".
       The sword's cut IS the diagonal boundary: muted static text lines on one
       side, live animated bars on the other. The blade isn't decoration sitting
       on a screen - it's the transformation the plugin performs. Sparks trail
       the cut, densest where it exits the frame.
       Golden ratio: screen 224 wide x 138 tall (224 / phi). -->
  <defs>
    <linearGradient id="acc" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3B82F6"/><stop offset="1" stop-color="#22D3EE"/>
    </linearGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="0.6" y2="1">
      <stop offset="0" stop-color="#60A5FA" stop-opacity="0.20"/>
      <stop offset="1" stop-color="#0EA5E9" stop-opacity="0.05"/>
    </linearGradient>
    <!-- Media blocks read as game art, not text. Hues sampled from real Steam
         capsule artwork (magenta/gold/teal) so the "after" state looks like
         imagery rather than styled text. -->
    <linearGradient id="media" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#7C3AED"/>
      <stop offset="0.5" stop-color="#DB2777"/>
      <stop offset="1" stop-color="#F59E0B"/>
    </linearGradient>
    <linearGradient id="media2" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0EA5E9"/>
      <stop offset="0.55" stop-color="#14B8A6"/>
      <stop offset="1" stop-color="#A3E635"/>
    </linearGradient>
    <clipPath id="scr"><rect x="27" y="41" width="202" height="116" rx="12"/></clipPath>
    <!-- everything left of the cut: the "before" state -->
    <clipPath id="beforeCut"><path d="M 27 41 L 210 41 L 60 157 L 27 157 Z"/></clipPath>
    <!-- everything right of the cut: the "after" state -->
    <clipPath id="afterCut"><path d="M 210 41 L 229 41 L 229 157 L 60 157 Z"/></clipPath>
  </defs>

  <!-- Layer 1: tv - monitor shell, glass screen, stand -->
  <g id="tv">
    <rect x="16" y="30" width="224" height="138" rx="20" fill="#0B1220" stroke="url(#acc)" stroke-width="9"/>
    <rect x="27" y="41" width="202" height="116" rx="12" fill="url(#glass)"/>
  </g>

  <!-- Layer 2: reveal - a real description's layout: media blocks alternating
       with text. Before the cut everything is inert grey; after it, the media
       blocks light up and the text turns accent-blue. -->
  <g id="reveal" clip-path="url(#scr)">
    <!-- BEFORE: the same layout, dead -->
    <g clip-path="url(#beforeCut)">
      <rect x="42" y="50" width="152" height="26" rx="4" fill="#3A4658"/>
      <rect x="42" y="80" width="96" height="7" rx="3.5" fill="#64748B" fill-opacity="0.75"/>
      <rect x="42" y="91" width="120" height="7" rx="3.5" fill="#64748B" fill-opacity="0.75"/>
      <rect x="42" y="104" width="152" height="22" rx="4" fill="#3A4658"/>
      <rect x="42" y="130" width="82" height="7" rx="3.5" fill="#64748B" fill-opacity="0.75"/>
      <rect x="42" y="141" width="110" height="7" rx="3.5" fill="#64748B" fill-opacity="0.75"/>
    </g>
    <!-- AFTER: media blocks alive, text in accent -->
    <g clip-path="url(#afterCut)">
      <rect x="42" y="50" width="152" height="26" rx="4" fill="url(#media)"/>
      <rect x="42" y="80" width="96" height="7" rx="3.5" fill="url(#acc)"/>
      <rect x="42" y="91" width="120" height="7" rx="3.5" fill="url(#acc)"/>
      <rect x="42" y="104" width="152" height="22" rx="4" fill="url(#media2)"/>
      <rect x="42" y="130" width="82" height="7" rx="3.5" fill="url(#acc)"/>
      <rect x="42" y="141" width="110" height="7" rx="3.5" fill="url(#acc)"/>
    </g>
  </g>

  <!-- Layer 3: cut - a bright edge with an accent core -->
  <g id="cut" clip-path="url(#scr)">
    <path d="M 213 38 L 57 160" stroke="#F0F9FF" stroke-width="7" stroke-linecap="round"/>
    <path d="M 213 38 L 57 160" stroke="url(#acc)" stroke-width="3" stroke-linecap="round"/>
  </g>

  <!-- Layer 4: stars - sparks struck along the cut, largest at the exit point
       and falling off in size and opacity down the blade's path -->
  <g id="stars" fill="#E0F2FE">
    <path d="M 213 27.0 L 216.7 34.3 L 224.0 38 L 216.7 41.7 L 213 49.0 L 209.3 41.7 L 202.0 38 L 209.3 34.3 Z" fill-opacity="0.95"/>
  </g>
  <!-- Every spark sits on the blue "after" side of the cut, verified at a
       perpendicular distance of 18-34 units so none straddle the boundary. -->
  <g id="stars-inner" clip-path="url(#afterCut)" fill="#F0F9FF">
    <path d="M 203 71.4 L 204.7 74.7 L 208.0 76.4 L 204.7 78.1 L 203 81.4 L 201.3 78.1 L 198.0 76.4 L 201.3 74.7 Z" fill-opacity="0.85"/>
    <path d="M 189 93.4 L 190.4 96.0 L 193.0 97.4 L 190.4 98.8 L 189 101.4 L 187.6 98.8 L 185.0 97.4 L 187.6 96.0 Z" fill-opacity="0.7"/>
    <path d="M 165 102.4 L 166.1 104.6 L 168.4 105.7 L 166.1 106.8 L 165 109.0 L 163.9 106.8 L 161.6 105.7 L 163.9 104.6 Z" fill-opacity="0.6"/>
    <path d="M 143 119.5 L 144.0 121.5 L 146.0 122.8 L 144.0 124.1 L 143 126.1 L 142.0 124.1 L 140.0 122.8 L 142.0 121.5 Z" fill-opacity="0.5"/>
    <path d="M 117 131.0 L 117.8 132.8 L 119.6 133.6 L 117.8 134.4 L 117 136.2 L 116.2 134.4 L 114.4 133.6 L 116.2 132.8 Z" fill-opacity="0.4"/>
  </g>

  <!-- Layer 5: stand -->
  <g id="stand">
    <rect x="118" y="168" width="20" height="20" fill="url(#acc)"/>
    <rect x="74" y="188" width="108" height="12" rx="6" fill="url(#acc)"/>
  </g>
</svg>
