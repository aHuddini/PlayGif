<svg xmlns="http://www.w3.org/2000/svg" width="256" height="256" viewBox="0 0 256 256">
  <!-- PlayGif icon - "slash reveal".
       The sword's cut IS the diagonal boundary: muted static text lines on one
       side, live animated bars on the other. The blade isn't decoration sitting
       on a screen - it's the transformation the plugin performs. Sparks trail
       the cut, densest where it exits the frame.
       Golden ratio: screen 224 wide x 138 tall (224 / phi). -->
  <defs>
    <linearGradient id="acc" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3B82F6"/><stop offset="1" stop-color="#22D3EE"/>
    </linearGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="0.6" y2="1">
      <stop offset="0" stop-color="#60A5FA" stop-opacity="0.20"/>
      <stop offset="1" stop-color="#0EA5E9" stop-opacity="0.05"/>
    </linearGradient>
    <clipPath id="scr"><rect x="27" y="41" width="202" height="116" rx="12"/></clipPath>
    <!-- everything left of the cut: the "before" state -->
    <clipPath id="beforeCut"><path d="M 27 41 L 210 41 L 60 157 L 27 157 Z"/></clipPath>
    <!-- everything right of the cut: the "after" state -->
    <clipPath id="afterCut"><path d="M 210 41 L 229 41 L 229 157 L 60 157 Z"/></clipPath>
  </defs>

  <!-- Layer 1: tv - monitor shell, glass screen, stand -->
  <g id="tv">
    <rect x="16" y="30" width="224" height="138" rx="20" fill="#0B1220" stroke="url(#acc)" stroke-width="9"/>
    <rect x="27" y="41" width="202" height="116" rx="12" fill="url(#glass)"/>
  </g>

  <!-- Layer 2: reveal - the same four lines, dead before the cut and alive after -->
  <g id="reveal" clip-path="url(#scr)">
    <g clip-path="url(#beforeCut)" fill="#64748B" fill-opacity="0.7">
      <rect x="44" y="62" width="86" height="9" rx="4.5"/>
      <rect x="44" y="82" width="110" height="9" rx="4.5"/>
      <rect x="44" y="102" width="72" height="9" rx="4.5"/>
      <rect x="44" y="122" width="96" height="9" rx="4.5"/>
    </g>
    <g clip-path="url(#afterCut)" fill="url(#acc)">
      <rect x="44" y="62" width="150" height="9" rx="4.5"/>
      <rect x="44" y="82" width="150" height="9" rx="4.5"/>
      <rect x="44" y="102" width="150" height="9" rx="4.5"/>
      <rect x="44" y="122" width="150" height="9" rx="4.5"/>
    </g>
  </g>

  <!-- Layer 3: cut - a bright edge with an accent core -->
  <g id="cut" clip-path="url(#scr)">
    <path d="M 213 38 L 57 160" stroke="#F0F9FF" stroke-width="7" stroke-linecap="round"/>
    <path d="M 213 38 L 57 160" stroke="url(#acc)" stroke-width="3" stroke-linecap="round"/>
  </g>

  <!-- Layer 4: stars - sparks struck along the cut, largest at the exit point
       and falling off in size and opacity down the blade's path -->
  <g id="stars" fill="#E0F2FE">
    <path d="M 213 27.0 L 216.7 34.3 L 224.0 38 L 216.7 41.7 L 213 49.0 L 209.3 41.7 L 202.0 38 L 209.3 34.3 Z" fill-opacity="0.95"/>
  </g>
  <!-- Every spark sits on the blue "after" side of the cut, verified at a
       perpendicular distance of 18-34 units so none straddle the boundary. -->
  <g id="stars-inner" clip-path="url(#afterCut)" fill="#F0F9FF">
    <path d="M 207 63.4 L 208.3 66.7 L 211.6 68 L 208.3 70.1 L 207 73.4 L 204.9 70.1 L 201.6 68 L 204.9 66.7 Z" fill-opacity="0.85"/>
    <path d="M 193 92.5 L 194.7 95.1 L 197.4 97 L 194.7 97.9 L 193 100.5 L 192.0 97.9 L 189.4 97 L 192.0 95.1 Z" fill-opacity="0.7"/>
    <path d="M 164 100.7 L 165.3 103.0 L 167.6 104 L 165.3 105.3 L 164 107.5 L 163.0 105.3 L 160.8 104 L 163.0 103.0 Z" fill-opacity="0.6"/>
    <path d="M 146 125.8 L 146.7 127.7 L 148.6 129 L 146.7 129.7 L 146 131.6 L 144.7 129.7 L 142.8 129 L 144.7 127.7 Z" fill-opacity="0.5"/>
    <path d="M 115 135.2 L 115.7 136.8 L 117.3 138 L 115.7 138.4 L 115 140.0 L 114.1 138.4 L 112.5 138 L 114.1 136.8 Z" fill-opacity="0.4"/>
  </g>

  <!-- Layer 5: stand -->
  <g id="stand">
    <rect x="118" y="168" width="20" height="20" fill="url(#acc)"/>
    <rect x="74" y="188" width="108" height="12" rx="6" fill="url(#acc)"/>
  </g>
</svg>
