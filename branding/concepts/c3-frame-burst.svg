<svg xmlns="http://www.w3.org/2000/svg" width="256" height="256" viewBox="0 0 256 256">
  <!-- C3 "Frame burst" - abstract geometric.
       Film-frame squares accelerate left-to-right and dissolve into motion:
       a static strip becoming animation. No sword, no brush - pure rhythm.
       Everything sits on one horizontal axis, so cohesion is structural. -->
  <defs>
    <linearGradient id="acc" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3B82F6"/><stop offset="1" stop-color="#22D3EE"/>
    </linearGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="0.6" y2="1">
      <stop offset="0" stop-color="#60A5FA" stop-opacity="0.20"/>
      <stop offset="1" stop-color="#0EA5E9" stop-opacity="0.05"/>
    </linearGradient>
  </defs>

  <rect x="16" y="30" width="224" height="138" rx="20" fill="#0B1220" stroke="url(#acc)" stroke-width="9"/>
  <rect x="27" y="41" width="202" height="116" rx="12" fill="url(#glass)"/>
  <path d="M 27 53 Q 128 96 229 53 L 229 41 Q 229 41 217 41 L 39 41 Q 27 41 27 53 Z" fill="#E0F2FE" fill-opacity="0.09"/>

  <!-- static frame, fully drawn -->
  <rect x="44" y="76" width="46" height="46" rx="8" fill="none" stroke="#64748B" stroke-width="7" stroke-opacity="0.8"/>
  <!-- mid frame, part-dissolved -->
  <rect x="100" y="76" width="46" height="46" rx="8" fill="none" stroke="url(#acc)" stroke-width="7"
        stroke-dasharray="34 14" stroke-linecap="round"/>
  <!-- leading frame, mostly motion -->
  <rect x="156" y="76" width="46" height="46" rx="8" fill="url(#acc)" fill-opacity="0.16"
        stroke="url(#acc)" stroke-width="7" stroke-dasharray="16 20" stroke-linecap="round"/>
  <!-- play mark inside the live frame -->
  <path d="M 172 88 L 192 99 L 172 110 Z" fill="#F0F9FF"/>

  <!-- speed lines pulling right, on the frame's centre line -->
  <g stroke="url(#acc)" stroke-linecap="round" fill="none">
    <path d="M 210 99 L 224 99" stroke-width="7"/>
    <path d="M 208 82 L 218 82" stroke-width="5" stroke-opacity="0.6"/>
    <path d="M 208 116 L 218 116" stroke-width="5" stroke-opacity="0.6"/>
  </g>

  <rect x="118" y="168" width="20" height="20" fill="url(#acc)"/>
  <rect x="74" y="188" width="108" height="12" rx="6" fill="url(#acc)"/>
</svg>
