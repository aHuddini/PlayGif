<svg xmlns="http://www.w3.org/2000/svg" width="640" height="256" viewBox="0 0 640 256">
  <!-- PlayGif banner. Mark on the left, wordmark on the right at the golden
       division of the 640 canvas (640 Ã· Ï† â‰ˆ 395 â†’ mark occupies the left third). -->
  <defs>
    <linearGradient id="acc" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3B82F6"/>
      <stop offset="1" stop-color="#22D3EE"/>
    </linearGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="0.6" y2="1">
      <stop offset="0" stop-color="#60A5FA" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#0EA5E9" stop-opacity="0.06"/>
    </linearGradient>
    <linearGradient id="blade" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#93C5FD"/>
      <stop offset="0.5" stop-color="#DBEAFE"/>
      <stop offset="1" stop-color="#F0F9FF"/>
    </linearGradient>
    <linearGradient id="trail" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0"   stop-color="#22D3EE" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#38BDF8" stop-opacity="0.4"/>
      <stop offset="1"   stop-color="#A5D8FF" stop-opacity="0.92"/>
    </linearGradient>
    <!-- Wordmark gradient runs vertically, pale at the top to deep at the
         bottom, mirroring the in-app overlay's lettering -->
    <linearGradient id="wm" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#BFDBFE"/>
      <stop offset="0.45" stop-color="#60A5FA"/>
      <stop offset="1" stop-color="#1D4ED8"/>
    </linearGradient>
    <linearGradient id="media" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#7C3AED"/><stop offset="0.5" stop-color="#DB2777"/><stop offset="1" stop-color="#F59E0B"/></linearGradient>
    <linearGradient id="media2" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0EA5E9"/><stop offset="0.55" stop-color="#14B8A6"/><stop offset="1" stop-color="#A3E635"/></linearGradient>
    <clipPath id="bscreen">
      <rect x="49" y="71" width="158" height="91" rx="10"/>
    </clipPath>
    <clipPath id="bBefore"><path d="M 49 71 L 192 71 L 75 162 L 49 162 Z"/></clipPath>
    <clipPath id="bAfter"><path d="M 192 71 L 207 71 L 207 162 L 75 162 Z"/></clipPath>
  </defs>
  <g id="reveal" clip-path="url(#bscreen)">
    <g clip-path="url(#bBefore)">
      <rect x="61" y="78" width="119" height="20" rx="3" fill="#3A4658"/>
      <rect x="61" y="102" width="75" height="5.5" rx="2.75" fill="#64748B" fill-opacity="0.75"/>
      <rect x="61" y="111" width="94" height="5.5" rx="2.75" fill="#64748B" fill-opacity="0.75"/>
      <rect x="61" y="121" width="119" height="17" rx="3" fill="#3A4658"/>
      <rect x="61" y="142" width="64" height="5.5" rx="2.75" fill="#64748B" fill-opacity="0.75"/>
      <rect x="61" y="151" width="86" height="5.5" rx="2.75" fill="#64748B" fill-opacity="0.75"/>
    </g>
</svg>

