<svg xmlns="http://www.w3.org/2000/svg" width="640" height="256" viewBox="0 0 640 256">
  <!-- PlayGif banner. Mark on the left, wordmark on the right at the golden
       division of the 640 canvas (640 ÷ φ ≈ 395 → mark occupies the left third). -->
  <defs>
    <linearGradient id="acc" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3B82F6"/>
      <stop offset="1" stop-color="#22D3EE"/>
    </linearGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="0.6" y2="1">
      <stop offset="0" stop-color="#60A5FA" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#0EA5E9" stop-opacity="0.06"/>
    </linearGradient>
    <linearGradient id="blade" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#93C5FD"/>
      <stop offset="0.5" stop-color="#DBEAFE"/>
      <stop offset="1" stop-color="#F0F9FF"/>
    </linearGradient>
    <linearGradient id="trail" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0"   stop-color="#22D3EE" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#38BDF8" stop-opacity="0.4"/>
      <stop offset="1"   stop-color="#A5D8FF" stop-opacity="0.92"/>
    </linearGradient>
    <!-- Wordmark gradient runs vertically, pale at the top to deep at the
         bottom, mirroring the in-app overlay's lettering -->
    <linearGradient id="wm" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#BFDBFE"/>
      <stop offset="0.45" stop-color="#60A5FA"/>
      <stop offset="1" stop-color="#1D4ED8"/>
    </linearGradient>
    <linearGradient id="media" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#7C3AED"/><stop offset="0.5" stop-color="#DB2777"/><stop offset="1" stop-color="#F59E0B"/></linearGradient>
    <linearGradient id="media2" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0EA5E9"/><stop offset="0.55" stop-color="#14B8A6"/><stop offset="1" stop-color="#A3E635"/></linearGradient>
    <clipPath id="bscreen">
      <rect x="49" y="71" width="158" height="91" rx="10"/>
    </clipPath>
    <clipPath id="bBefore"><path d="M 49 71 L 192 71 L 75 162 L 49 162 Z"/></clipPath>
    <clipPath id="bAfter"><path d="M 192 71 L 207 71 L 207 162 L 75 162 Z"/></clipPath>
  </defs>

  <!-- Layer 1: badge — rounded dark plate behind everything -->
  <g id="badge">
    <rect x="8" y="8" width="624" height="240" rx="28" fill="#0B1220"/>
    <rect x="8" y="8" width="624" height="240" rx="28" fill="none" stroke="url(#acc)" stroke-opacity="0.35" stroke-width="2"/>
  </g>

  <!-- Layer 2: tv — monitor housing the mark -->
  <g id="tv">
    <rect x="40" y="62" width="176" height="109" rx="16" fill="#0B1220" stroke="url(#acc)" stroke-width="7"/>
    <rect x="49" y="71" width="158" height="91" rx="10" fill="url(#glass)"/>
    <path d="M 49 80 Q 128 114 207 80 L 207 71 Q 207 71 198 71 L 58 71 Q 49 71 49 80 Z" fill="#E0F2FE" fill-opacity="0.10"/>
    <rect x="120" y="171" width="16" height="16" fill="url(#acc)"/>
    <rect x="86" y="187" width="84" height="10" rx="5" fill="url(#acc)"/>
  </g>

  <!-- Layer 3: reveal - dead text lines before the cut, live bars after -->
  <g id="reveal" clip-path="url(#bscreen)">
    <g clip-path="url(#bBefore)">
      <rect x="61" y="78" width="119" height="20" rx="3" fill="#3A4658"/>
      <rect x="61" y="102" width="75" height="5.5" rx="2.75" fill="#64748B" fill-opacity="0.75"/>
      <rect x="61" y="111" width="94" height="5.5" rx="2.75" fill="#64748B" fill-opacity="0.75"/>
      <rect x="61" y="121" width="119" height="17" rx="3" fill="#3A4658"/>
      <rect x="61" y="142" width="64" height="5.5" rx="2.75" fill="#64748B" fill-opacity="0.75"/>
      <rect x="61" y="151" width="86" height="5.5" rx="2.75" fill="#64748B" fill-opacity="0.75"/>
    </g>
    <g clip-path="url(#bAfter)">
      <rect x="61" y="78" width="119" height="20" rx="3" fill="url(#media)"/>
      <rect x="61" y="102" width="75" height="5.5" rx="2.75" fill="url(#acc)"/>
      <rect x="61" y="111" width="94" height="5.5" rx="2.75" fill="url(#acc)"/>
      <rect x="61" y="121" width="119" height="17" rx="3" fill="url(#media2)"/>
      <rect x="61" y="142" width="64" height="5.5" rx="2.75" fill="url(#acc)"/>
      <rect x="61" y="151" width="86" height="5.5" rx="2.75" fill="url(#acc)"/>
    </g>
  </g>

  <!-- Layer 4: cut - bright edge with accent core -->
  <g id="cut" clip-path="url(#bscreen)">
    <path d="M 194 69 L 72 164" stroke="#F0F9FF" stroke-width="5.5" stroke-linecap="round"/>
    <path d="M 194 69 L 72 164" stroke="url(#acc)" stroke-width="2.3" stroke-linecap="round"/>
  </g>

  <!-- Layer 5: stars - sparks along the cut, largest at the exit -->
  <g id="stars" fill="#F0F9FF">
    <path d="M 194 60.4 L 196.9 66.1 L 202.6 69 L 196.9 71.9 L 194 77.6 L 191.1 71.9 L 185.4 69 L 191.1 66.1 Z" fill-opacity="0.95"/>
  </g>
  <g id="stars-inner" clip-path="url(#bscreen)" fill="#F0F9FF">
    <path d="M 181 78.1 L 182.3 80.7 L 184.9 82 L 182.3 83.3 L 181 85.9 L 179.7 83.3 L 177.1 82 L 179.7 80.7 Z" fill-opacity="0.9"/>
    <path d="M 162 108.2 L 163.0 110.0 L 164.8 111 L 163.0 112.0 L 162 113.8 L 161.0 112.0 L 159.2 111 L 161.0 110.0 Z" fill-opacity="0.7"/>
    <path d="M 137 94.7 L 137.8 96.2 L 139.3 97 L 137.8 97.8 L 137 99.3 L 136.2 97.8 L 134.7 97 L 136.2 96.2 Z" fill-opacity="0.6"/>
    <path d="M 120 126.0 L 120.7 127.3 L 122.0 128 L 120.7 128.7 L 120 130.0 L 119.3 128.7 L 118.0 128 L 119.3 127.3 Z" fill-opacity="0.5"/>
    <path d="M 97 143.4 L 97.5 144.5 L 98.6 145 L 97.5 145.5 L 97 146.6 L 96.5 145.5 L 95.4 145 L 96.5 144.5 Z" fill-opacity="0.38"/>
  </g>

  <!-- Layer 6: wordmark. Matches the in-app overlay's treatment: heavy
       condensed weight, tight tracking, and a vertical pale-to-deep blue
       gradient (not the diagonal accent used elsewhere). -->
  <g id="wordmark" font-family="'Segoe UI Black','Arial Black','Helvetica Neue',Impact,sans-serif" font-weight="900">
    <text x="256" y="140" font-size="78" letter-spacing="-2" fill="#F8FAFC">Play<tspan fill="url(#wm)">Gif</tspan></text>
    <text x="260" y="176" font-size="17" font-family="'Segoe UI','Arial',sans-serif" font-weight="600"
          fill="#7C93B4" letter-spacing="4.5">ANIMATED DESCRIPTIONS</text>
  </g>
</svg>
