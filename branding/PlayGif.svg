<svg xmlns="http://www.w3.org/2000/svg" width="640" height="256" viewBox="0 0 640 256">
  <!-- PlayGif banner. Mark on the left, wordmark on the right at the golden
       division of the 640 canvas (640 ÷ φ ≈ 395 → mark occupies the left third). -->
  <defs>
    <linearGradient id="acc" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3B82F6"/>
      <stop offset="1" stop-color="#22D3EE"/>
    </linearGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="0.6" y2="1">
      <stop offset="0" stop-color="#60A5FA" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#0EA5E9" stop-opacity="0.06"/>
    </linearGradient>
    <linearGradient id="blade" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#DBEAFE"/>
      <stop offset="0.55" stop-color="#93C5FD"/>
      <stop offset="1" stop-color="#22D3EE"/>
    </linearGradient>
  </defs>

  <!-- Layer 1: badge — rounded dark plate behind everything -->
  <g id="badge">
    <rect x="8" y="8" width="624" height="240" rx="28" fill="#0B1220"/>
    <rect x="8" y="8" width="624" height="240" rx="28" fill="none" stroke="url(#acc)" stroke-opacity="0.35" stroke-width="2"/>
  </g>

  <!-- Layer 2: tv — monitor housing the mark -->
  <g id="tv">
    <rect x="40" y="62" width="176" height="109" rx="16" fill="#0B1220" stroke="url(#acc)" stroke-width="7"/>
    <rect x="49" y="71" width="158" height="91" rx="10" fill="url(#glass)"/>
    <path d="M 49 80 Q 128 114 207 80 L 207 71 Q 207 71 198 71 L 58 71 Q 49 71 49 80 Z" fill="#E0F2FE" fill-opacity="0.10"/>
    <rect x="120" y="171" width="16" height="16" fill="url(#acc)"/>
    <rect x="86" y="187" width="84" height="10" rx="5" fill="url(#acc)"/>
  </g>

  <!-- Layer 3: motion — speed lines trailing the hilt, parallel to the blade -->
  <g id="motion" stroke="url(#acc)" stroke-linecap="round" fill="none">
    <path d="M 62 147 L 84 125" stroke-width="7" stroke-opacity="0.80"/>
    <path d="M 60 122 L 77 105" stroke-width="5.5" stroke-opacity="0.50"/>
    <path d="M 84 164 L 101 147" stroke-width="5.5" stroke-opacity="0.35"/>
  </g>

  <!-- Layer 4: sword — blade from hilt (104,150) to tip (174,80), tapered -->
  <g id="sword">
    <path d="M 110 156 L 163 98 L 174 80 L 156 91 L 98 144 Z" fill="url(#blade)"/>
    <path d="M 104 150 L 161 93 L 164 96 L 107 153 Z" fill="#0B1220" fill-opacity="0.20"/>
    <path d="M 174 80 L 163 98 L 167 101 L 174 80 Z" fill="#F0F9FF" fill-opacity="0.9"/>
    <path d="M 120 166 L 92 138" stroke="url(#acc)" stroke-width="11" stroke-linecap="butt"/>
    <path d="M 101 153 L 91 163" stroke="url(#acc)" stroke-width="9" stroke-linecap="round"/>
    <circle cx="88" cy="166" r="6.5" fill="url(#acc)"/>
  </g>

  <!-- Layer 5: stars — sparkle particles -->
  <g id="stars" fill="#E0F2FE">
    <path d="M 182 62 L 185 70 L 193 73 L 185 76 L 182 84 L 179 76 L 171 73 L 179 70 Z" fill-opacity="0.95"/>
    <path d="M 147 96 L 149 101 L 154 103 L 149 105 L 147 110 L 145 105 L 140 103 L 145 101 Z" fill-opacity="0.75"/>
  </g>

  <!-- Layer 6: wordmark — "PlayGif", Gif in accent -->
  <g id="wordmark" font-family="Segoe UI, Arial, sans-serif" font-weight="700">
    <text x="258" y="142" font-size="72" fill="#F5F5F5">Play<tspan fill="url(#acc)">Gif</tspan></text>
    <text x="262" y="178" font-size="19" font-weight="400" fill="#8AA0BF" letter-spacing="1.5">ANIMATED DESCRIPTIONS</text>
  </g>
</svg>
