<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<style>
    :root {
        --text-color: #ffffff;
        --link-color: #0078d4;
        --font-size: 14px;
        --font-family: Segoe UI, sans-serif;
        --bg-color: transparent;
    }
    html, body {
        margin: 0;
        padding: 0;
        background: var(--bg-color);
        color: var(--text-color);
        font-family: var(--font-family);
        font-size: var(--font-size);
        overflow-y: auto;
        overflow-x: hidden;
    }
    #content {
        padding: 0 8px 0 0;
    }
    #content img {
        max-width: 100%;
        height: auto;
        display: block;
    }
    #content video {
        max-width: 100%;
        height: auto;
        display: block;
    }
    #content a {
        color: var(--link-color);
        text-decoration: none;
    }
    #content a:hover {
        text-decoration: underline;
    }
    ::-webkit-scrollbar {
        width: 5px;
    }
    ::-webkit-scrollbar-track {
        background: transparent;
    }
    ::-webkit-scrollbar-thumb {
        background: rgba(255,255,255,0.15);
        border-radius: 3px;
    }
    ::-webkit-scrollbar-thumb:hover {
        background: rgba(255,255,255,0.35);
    }
</style>
</head>
<body>
<div id="content"></div>
<script>
    function setContent(html) {
        var el = document.getElementById('content');
        el.innerHTML = html;
        var videos = el.querySelectorAll('video');
        for (var i = 0; i < videos.length; i++) {
            var v = videos[i];
            v.muted = true;
            v.autoplay = true;
            v.playsInline = true;
            v.removeAttribute('loop');
            v.onended = function() {
                this.currentTime = 0;
                this.play().catch(function(){});
            };
            v.play().catch(function(){});
        }
        window.scrollTo(0, 0);
        setTimeout(reportHeight, 100);
    }

    function setTheme(textColor, linkColor, fontSize, fontFamily, bgColor) {
        var root = document.documentElement.style;
        root.setProperty('--text-color', textColor);
        root.setProperty('--link-color', linkColor);
        root.setProperty('--font-size', fontSize);
        root.setProperty('--font-family', fontFamily);
        root.setProperty('--bg-color', bgColor || 'transparent');
    }

    function pauseAll() {
        var videos = document.querySelectorAll('video');
        for (var i = 0; i < videos.length; i++) {
            videos[i].pause();
        }
    }

    function resumeAll() {
        var videos = document.querySelectorAll('video');
        for (var i = 0; i < videos.length; i++) {
            videos[i].play().catch(function(){});
        }
    }

    function reportHeight() {
        var height = document.getElementById('content').scrollHeight;
        window.chrome.webview.postMessage(JSON.stringify({ type: 'height', value: height }));
    }

    new MutationObserver(function() {
        setTimeout(reportHeight, 200);
    }).observe(document.getElementById('content'), { childList: true, subtree: true });

    // Forward scroll to WPF only at top/bottom boundary
    window.addEventListener('wheel', function(e) {
        var atTop = window.scrollY <= 0;
        var atBottom = (window.innerHeight + window.scrollY) >= document.body.scrollHeight - 2;
        if ((e.deltaY < 0 && atTop) || (e.deltaY > 0 && atBottom)) {
            window.chrome.webview.postMessage('S' + e.deltaY);
        }
    }, { passive: true });
</script>
</body>
</html>
