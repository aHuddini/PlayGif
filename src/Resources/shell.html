<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<style>
    :root {
        --text-color: #ffffff;
        --link-color: #0078d4;
        --font-size: 14px;
        --font-family: Segoe UI, sans-serif;
        --bg-color: transparent;
    }
    html, body {
        margin: 0;
        padding: 0;
        background: var(--bg-color);
        color: var(--text-color);
        font-family: var(--font-family);
        font-size: var(--font-size);
        overflow: hidden;
        overscroll-behavior: none;
    }
    #content {
        /* bottom padding keeps the final line clear of the clip edge */
        padding: 0 8px 4px 0;
    }
    #content img {
        max-width: 100%;
        height: auto;
        display: block;
        margin: 5px auto;
    }
    #content video {
        max-width: 100%;
        height: auto;
        display: block;
        margin: 5px auto;
    }
    #content a {
        color: var(--link-color);
        text-decoration: none;
    }
    #content a:hover {
        text-decoration: underline;
    }
    ::-webkit-scrollbar {
        display: none;
    }
</style>
</head>
<body>
<div id="content"></div>
<script>
    // IntersectionObserver: only play videos near the visible area
    // Reduces GPU/decoder load which is the #1 cause of scroll stalls
    var _videoObserver = null;
    var _posterOnly = false;

    function setPosterOnly(enabled) {
        _posterOnly = enabled;
    }

    function setupVideoObserver() {
        if (_posterOnly) return;
        if (_videoObserver) _videoObserver.disconnect();

        _videoObserver = new IntersectionObserver(function(entries) {
            entries.forEach(function(entry) {
                var video = entry.target;
                if (entry.isIntersecting) {
                    video.play().catch(function(){});
                } else {
                    video.pause();
                }
            });
        }, {
            // Start loading slightly before visible (200px margin)
            rootMargin: '200px 0px'
        });

        var videos = document.querySelectorAll('video');
        for (var i = 0; i < videos.length; i++) {
            _videoObserver.observe(videos[i]);
        }
    }

    function setContent(html) {
        var el = document.getElementById('content');
        el.innerHTML = html;
        var videos = el.querySelectorAll('video');
        for (var i = 0; i < videos.length; i++) {
            var v = videos[i];
            v.muted = true;
            v.playsInline = true;
            v.preload = 'none';
            v.removeAttribute('loop');
            v.removeAttribute('autoplay');
            v.removeAttribute('crossorigin');
            v.removeAttribute('width');
            v.removeAttribute('height');
            v.onended = function() {
                this.currentTime = 0;
                this.play().catch(function(){});
            };
        }
        // Immediately play the first video so the page isn't blank
        if (videos.length > 0 && !_posterOnly) {
            videos[0].preload = 'auto';
            videos[0].play().catch(function(){});
        }

        // IntersectionObserver handles the rest based on visibility
        setupVideoObserver();

        // Report height multiple times as media loads and changes layout
        setTimeout(reportHeight, 100);
        setTimeout(reportHeight, 500);
        setTimeout(reportHeight, 1500);
        setTimeout(reportHeight, 3000);

        // Also report when each video/image loads its dimensions
        var media = el.querySelectorAll('video, img');
        for (var j = 0; j < media.length; j++) {
            media[j].addEventListener('loadedmetadata', reportHeight);
            media[j].addEventListener('load', reportHeight);
        }
    }

    function setVideoScale(pct) {
        var maxW = Math.max(10, Math.min(100, pct)) + '%';
        var els = document.querySelectorAll('#content video, #content img');
        for (var i = 0; i < els.length; i++) {
            els[i].style.maxWidth = maxW;
            els[i].style.margin = '5px auto';
        }
        setTimeout(reportHeight, 100);
    }

    function setMaxVideoHeight(px) {
        var videos = document.querySelectorAll('#content video');
        for (var i = 0; i < videos.length; i++) {
            videos[i].style.maxHeight = px > 0 ? (px + 'px') : '';
            videos[i].style.objectFit = px > 0 ? 'contain' : '';
            videos[i].style.margin = '5px auto';
        }
        setTimeout(reportHeight, 100);
    }

    function setTheme(textColor, linkColor, fontSize, fontFamily, bgColor) {
        var root = document.documentElement.style;
        root.setProperty('--text-color', textColor);
        root.setProperty('--link-color', linkColor);
        root.setProperty('--font-size', fontSize);
        root.setProperty('--font-family', fontFamily);
        root.setProperty('--bg-color', bgColor || 'transparent');
    }

    function pauseAll() {
        var videos = document.querySelectorAll('video');
        for (var i = 0; i < videos.length; i++) {
            videos[i].pause();
        }
    }

    function resumeAll() {
        setupVideoObserver();
    }

    // scrollHeight ignores the last child's bottom margin, which clips the final
    // line. getBoundingClientRect covers the real painted box.
    function measureHeight() {
        var el = document.getElementById('content');
        var h = el.scrollHeight;

        var rect = el.getBoundingClientRect();
        if (rect.height > h) h = rect.height;

        // Walk the last few children in case one overflows its parent
        var kids = el.children;
        for (var i = Math.max(0, kids.length - 5); i < kids.length; i++) {
            var kr = kids[i].getBoundingClientRect();
            var bottom = kr.bottom - rect.top;
            var margin = parseFloat(getComputedStyle(kids[i]).marginBottom) || 0;
            if (bottom + margin > h) h = bottom + margin;
        }

        return Math.ceil(h) + 4; // small guard against sub-pixel rounding
    }

    var _lastHeight = 0;

    function reportHeight() {
        var height = measureHeight();
        if (height === _lastHeight) return;
        _lastHeight = height;
        window.chrome.webview.postMessage(JSON.stringify({ type: 'height', value: height }));
    }

    new MutationObserver(function() {
        setTimeout(reportHeight, 200);
    }).observe(document.getElementById('content'), { childList: true, subtree: true });

    // Re-measure whenever layout actually changes — catches late font loading and
    // reflow past the timer ladder, which is the no-media case that clipped text
    if (window.ResizeObserver) {
        new ResizeObserver(function() { reportHeight(); })
            .observe(document.getElementById('content'));
    }

    // Web fonts change text metrics after first paint
    if (document.fonts && document.fonts.ready) {
        document.fonts.ready.then(function() { reportHeight(); });
    }

    window.addEventListener('load', reportHeight);

    // Forward ALL wheel events to WPF — no internal scrolling
    window.addEventListener('wheel', function(e) {
        window.chrome.webview.postMessage('S' + e.deltaY);
        e.preventDefault();
    }, { passive: false });
</script>
</body>
</html>
