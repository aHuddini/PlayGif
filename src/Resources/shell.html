<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<style>
    :root {
        --text-color: #ffffff;
        --link-color: #0078d4;
        --font-size: 14px;
        --font-family: Segoe UI, sans-serif;
        --bg-color: transparent;
    }
    html, body {
        margin: 0;
        padding: 0;
        background: var(--bg-color);
        color: var(--text-color);
        font-family: var(--font-family);
        font-size: var(--font-size);
        overflow-y: auto;
        overflow-x: hidden;
    }
    #content {
        padding: 0 8px 0 0;
    }
    #content img {
        max-width: 100%;
        height: auto;
        display: block;
    }
    #content video {
        max-width: 100%;
        height: auto;
        display: block;
    }
    #content a {
        color: var(--link-color);
        text-decoration: none;
    }
    #content a:hover {
        text-decoration: underline;
    }
    /* Minimal scrollbar — nearly invisible until hovered */
    ::-webkit-scrollbar {
        width: 5px;
    }
    ::-webkit-scrollbar-track {
        background: transparent;
    }
    ::-webkit-scrollbar-thumb {
        background: rgba(255,255,255,0.15);
        border-radius: 3px;
    }
    ::-webkit-scrollbar-thumb:hover {
        background: rgba(255,255,255,0.35);
    }
</style>
</head>
<body>
<div id="content"></div>
<script>
    var _fullscreenMode = false;

    function setFullscreenMode(enabled) {
        _fullscreenMode = enabled;
        document.body.style.overflowY = enabled ? 'hidden' : 'auto';
    }

    function setContent(html) {
        var el = document.getElementById('content');
        el.innerHTML = html;
        var videos = el.querySelectorAll('video');
        for (var i = 0; i < videos.length; i++) {
            videos[i].muted = true;
            videos[i].loop = true;
            videos[i].autoplay = true;
            videos[i].playsInline = true;
            videos[i].play().catch(function(){});
        }
        window.scrollTo(0, 0);
        // In fullscreen mode, report height so WPF ScrollViewer can size us
        if (_fullscreenMode) {
            setTimeout(reportHeight, 100);
        }
    }

    function setTheme(textColor, linkColor, fontSize, fontFamily, bgColor) {
        var root = document.documentElement.style;
        root.setProperty('--text-color', textColor);
        root.setProperty('--link-color', linkColor);
        root.setProperty('--font-size', fontSize);
        root.setProperty('--font-family', fontFamily);
        root.setProperty('--bg-color', bgColor || 'transparent');
    }

    function pauseAll() {
        var videos = document.querySelectorAll('video');
        for (var i = 0; i < videos.length; i++) {
            videos[i].pause();
        }
    }

    function resumeAll() {
        var videos = document.querySelectorAll('video');
        for (var i = 0; i < videos.length; i++) {
            videos[i].play().catch(function(){});
        }
    }

    // Report content height to WPF (fullscreen mode only)
    function reportHeight() {
        var height = document.getElementById('content').scrollHeight;
        window.chrome.webview.postMessage(JSON.stringify({ type: 'height', value: height }));
    }

    // Re-report when content changes (images/videos loading)
    new MutationObserver(function() {
        if (_fullscreenMode) setTimeout(reportHeight, 200);
    }).observe(document.getElementById('content'), { childList: true, subtree: true });

    // Forward scroll to WPF parent when at top/bottom edge (desktop mode)
    window.addEventListener('wheel', function(e) {
        var atTop = window.scrollY <= 0;
        var atBottom = (window.innerHeight + window.scrollY) >= document.body.scrollHeight - 2;

        if ((e.deltaY < 0 && atTop) || (e.deltaY > 0 && atBottom)) {
            window.chrome.webview.postMessage(JSON.stringify({
                type: 'scroll',
                delta: e.deltaY
            }));
        }
    }, { passive: true });
</script>
</body>
</html>
