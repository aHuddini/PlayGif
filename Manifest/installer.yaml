AddonId: 'PlayGif.2e196d25-24d1-4db3-b732-9766c994a496'
Packages:
  - Version: 1.0.1
    RequiredApiVersion: 6.16.0
    ReleaseDate: 2026-07-26
    PackageUrl: 'https://github.com/aHuddini/PlayGif/releases/download/1.0.1/PlayGif-1_0_1.pext'
    Changelog:
      - '[Critical Fix] Descriptions stopped animating after switching between Grid and Details view. The renderer now re-attaches to whichever view is on screen instead of staying with the first one it found.'
      - '[Critical Fix] In Grid view the renderer could attach to the hidden Details panel, leaving the visible description static. It now asks Playnite which view is active rather than guessing.'
      - '[New Feature] Video scale is now a dropdown (100/90/75/50/35/25%). Lowering it decodes fewer pixels, which helps on slower machines.'
      - '[New Feature] Theme Support settings tab with a one-click layout report for diagnosing theme compatibility problems.'
      - '[Improved] Added "Open debug log folder" so the log is easy to find when reporting an issue.'
  - Version: 1.0.0
    RequiredApiVersion: 6.16.0
    ReleaseDate: 2026-07-25
    PackageUrl: 'https://github.com/aHuddini/PlayGif/releases/download/1.0.0/PlayGif-1_0_0.pext'
    Changelog:
      - '[New Feature] Animated game descriptions: Steam store trailers, GIFs, animated WebP and AVIF play inline instead of showing as static text.'
      - '[New Feature] Fetch rich descriptions from Steam or GOG for any game, individually or in bulk for your whole library.'
      - '[New Feature] Add your own media to any description - from a local file, a URL, or a built-in web image search.'
      - '[New Feature] Per-game video scale (25/50/75%), plus a global scale and max-height limit.'
      - '[Performance] Videos play as H.264 MP4 wherever available, which is hardware-decoded far more widely than VP9 - smoother playback and roughly half the disk use.'
      - '[Performance] Media caching for offline viewing, with a configurable per-game size limit.'
      - '[Improved] Playback pauses automatically while a game is running or when Playnite loses focus.'
